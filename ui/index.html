<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Task Worker</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #18202b; --muted: #687385; --line: #e3e7ed;
    --accent: #2457d6; --ok: #137a43; --ok-bg: #e7f6ee; --warn: #9a5b00; --warn-bg: #fff4e0;
    --err: #b42318; --err-bg: #fdecea; --ver: #6d3fc0; --ver-bg: #f1ebfc; --code: #f1f3f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1318; --panel: #171c23; --ink: #e6e9ee; --muted: #8d97a6; --line: #262d37;
      --accent: #6f9bff; --ok: #4cc38a; --ok-bg: #12291e; --warn: #f0b350; --warn-bg: #2c2210;
      --err: #ff7a6b; --err-bg: #2f1715; --ver: #b79cff; --ver-bg: #221a33; --code: #1f252e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; }
  header .model { margin-left: auto; color: var(--muted); font-size: 12px; }
  .layout { display: grid; grid-template-columns: 320px minmax(0, 1fr) 420px; gap: 16px; padding: 16px; height: calc(100vh - 50px); }
  .col { overflow-y: auto; min-height: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  textarea, select, input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  textarea { min-height: 96px; resize: vertical; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; background: var(--accent); color: #fff; }
  button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button.deny { background: var(--err); }
  button.approve { background: var(--ok); }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .examples button { display: block; width: 100%; text-align: left; margin: 6px 0 0; background: var(--bg); color: var(--ink); border: 1px solid var(--line); font-size: 12.5px; }
  .run-item { padding: 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .run-item:hover, .run-item.active { border-color: var(--line); background: var(--bg); }
  .run-item .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--code); color: var(--muted); }
  .badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.err { background: var(--err-bg); color: var(--err); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); } .badge.ver { background: var(--ver-bg); color: var(--ver); }
  .muted { color: var(--muted); } .small { font-size: 12px; }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .ev { border-left: 3px solid var(--line); padding: 6px 10px; margin: 0 0 8px; }
  .ev .who { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .ev.thought { border-color: var(--accent); }
  .ev.action { border-color: var(--muted); }
  .ev.error { border-color: var(--err); background: var(--err-bg); }
  .ev.warn { border-color: var(--warn); background: var(--warn-bg); }
  .ev.good { border-color: var(--ok); background: var(--ok-bg); }
  .ev.verifier { border-color: var(--ver); }
  .ev.verification { border-color: var(--ver); background: var(--ver-bg); }
  code, pre { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  pre { background: var(--code); padding: 8px; border-radius: 6px; white-space: pre-wrap; max-height: 220px; overflow: auto; margin: 6px 0 0; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .thumb { max-width: 160px; border: 1px solid var(--line); border-radius: 4px; margin-top: 6px; cursor: zoom-in; display: block; }
  .live img { width: 100%; border: 1px solid var(--line); border-radius: 6px; }
  .plan li { margin: 3px 0; list-style: none; }
  .plan ul { padding-left: 4px; margin: 0; }
  .plan .done { color: var(--ok); } .plan .in_progress { color: var(--accent); font-weight: 600; } .plan .failed { color: var(--err); } .plan .skipped { color: var(--muted); text-decoration: line-through; }
  .pending { border: 2px solid var(--warn); background: var(--warn-bg); }
  .pending h2 { color: var(--warn); }
  .facts dt { font-weight: 600; } .facts dd { margin: 0 0 6px; color: var(--muted); word-break: break-word; }
  .check { margin: 4px 0; }
  .empty { color: var(--muted); text-align: center; padding: 40px 10px; }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; }
  #lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 6px; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; height: auto; } }
</style>
</head>
<body>
<header><h1>AI Task Worker</h1><span class="badge">Acme Corp sandbox</span><span class="model" id="model"></span></header>
<div class="layout">
  <div class="col">
    <div class="card">
      <h2>New task</h2>
      <textarea id="task" placeholder="Describe the outcome you want, in plain language"></textarea>
      <div class="row">
        <select id="approval" title="Approval policy" style="width:auto">
          <option value="risky">Approve risky actions</option>
          <option value="always">Approve every change</option>
          <option value="never">Fully autonomous</option>
        </select>
        <label class="small"><input type="checkbox" id="headed"> show browser</label>
      </div>
      <div class="row"><button id="start">Run task</button></div>
      <div class="examples" id="examples"></div>
    </div>
    <div class="card"><h2>Runs</h2><div id="runs"><div class="muted small">No runs yet.</div></div></div>
  </div>

  <div class="col" id="main">
    <div class="empty">Start a task or pick a run to watch the worker plan, act, recover and verify.</div>
  </div>

  <div class="col">
    <div class="card live"><h2>Live view</h2><div id="live" class="muted small">Screenshots appear here as the worker acts.</div></div>
    <div class="card plan"><h2>Plan</h2><div id="plan" class="muted small">No plan yet.</div></div>
    <div class="card"><h2>Working memory</h2><dl class="facts" id="facts"><span class="muted small">Nothing remembered yet.</span></dl></div>
  </div>
</div>
<div id="lightbox"><img alt=""></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let current = null, source = null, state = null;

const OUTCOME = {
  completed_verified: ["ok", "Completed and verified"], completed_unverified: ["warn", "Completed (not verified)"],
  blocked: ["warn", "Blocked: needs a human"], failed: ["err", "Failed"], error: ["err", "Error"], cancelled: ["", "Cancelled"],
};

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.text()) || r.statusText);
  return r.json();
}

async function boot() {
  const ex = await api("/api/examples");
  $("model").textContent = "model: " + ex.provider;
  $("examples").innerHTML = ex.tasks.map(t => `<button data-t="${esc(t)}">${esc(t)}</button>`).join("");
  $("examples").onclick = (e) => { if (e.target.dataset.t) $("task").value = e.target.dataset.t; };
  $("start").onclick = start;
  $("lightbox").onclick = () => $("lightbox").style.display = "none";
  refreshRuns(); setInterval(refreshRuns, 3000);
}

async function start() {
  const task = $("task").value.trim(); if (!task) return;
  $("start").disabled = true;
  try {
    const run = await api("/api/runs", { method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ task, approval_mode: $("approval").value, headless: !$("headed").checked }) });
    await refreshRuns(); open(run.run_id);
  } catch (e) { alert(e.message); } finally { $("start").disabled = false; }
}

async function refreshRuns() {
  const runs = await api("/api/runs");
  if (!runs.length) return;
  $("runs").innerHTML = runs.map(r => {
    const [cls, label] = r.outcome ? OUTCOME[r.outcome] || ["", r.outcome] : (r.pending.length ? ["warn", "Waiting for you"] : ["", "Running"]);
    return `<div class="run-item ${r.run_id === current ? "active" : ""}" data-id="${r.run_id}">
      <div class="t">${esc(r.task)}</div><span class="badge ${cls}">${label}</span> <span class="muted small">${r.run_id.slice(9, 15)}</span></div>`;
  }).join("");
  $("runs").querySelectorAll(".run-item").forEach(el => el.onclick = () => open(el.dataset.id));
}

function open(runId) {
  if (source) source.close();
  current = runId;
  state = { events: [], plan: [], facts: {}, pending: {}, usage: null, steps: 0, task: "", model: "", finished: null };
  $("main").innerHTML = `<div class="card" id="head"></div><div id="pendingBox"></div><div id="report"></div><div class="card"><h2>Timeline</h2><div id="timeline"></div></div>`;
  $("live").innerHTML = '<span class="muted small">Waiting for the first action...</span>';
  source = new EventSource(`/api/runs/${runId}/events`);
  source.onmessage = (m) => handle(JSON.parse(m.data));
  source.addEventListener("end", () => source.close());
  refreshRuns();
}

function shot(name) { return `/api/runs/${current}/files/screenshots/${encodeURIComponent(name)}`; }
window.zoom = (src) => { $("lightbox").querySelector("img").src = src; $("lightbox").style.display = "flex"; };

function handle(ev) {
  const d = ev.data, tl = $("timeline"); if (!tl) return;
  const who = d.actor === "verifier" ? "verifier" : "worker";
  const add = (cls, html) => { tl.insertAdjacentHTML("beforeend", `<div class="ev ${cls}">${html}</div>`); tl.lastElementChild.scrollIntoView({block: "nearest"}); };
  switch (ev.type) {
    case "run_started": state.task = d.task; state.model = `${d.provider}/${d.model}`; renderHead(); break;
    case "thought":
      if (d.reasoning) add(`thought ${who}`, `<div class="who">${who} · reasoning</div><details><summary>${esc(d.reasoning.slice(0, 140))}${d.reasoning.length > 140 ? "…" : ""}</summary><pre>${esc(d.reasoning)}</pre></details>`);
      if (d.text) add(`thought ${who}`, `<div class="who">${who}</div>${esc(d.text)}`);
      break;
    case "action": {
      const args = Object.fromEntries(Object.entries(d.args).filter(([k]) => k !== "intent"));
      if (d.tool === "update_plan" || d.tool === "remember") break;
      add(`action ${who}`, `<div class="who">${who} · ${esc(d.tool)}</div>${d.intent ? esc(d.intent) + "<br>" : ""}<code>${esc(JSON.stringify(args))}</code>`);
      break; }
    case "observation":
      if (["update_plan", "remember"].includes(d.tool)) break;
      if (d.screenshot) { $("live").innerHTML = `<img src="${shot(d.screenshot)}" onclick="zoom(this.src)" alt="latest screen"><div class="muted small">${esc(d.url || "")}</div>`; }
      add(d.ok ? `${who}` : `error ${who}`, `<div class="who">${d.ok ? "observation" : "failed · " + esc(d.error_kind)}</div>
        <details><summary>${esc(d.content.split("\n")[0].slice(0, 160))}</summary><pre>${esc(d.content)}</pre></details>
        ${d.screenshot ? `<img class="thumb" src="${shot(d.screenshot)}" onclick="zoom(this.src)" alt="">` : ""}`);
      break;
    case "retry": add("warn", `<div class="who">automatic retry</div>${esc(d.tool)} attempt ${d.attempt} failed (${esc(d.error)}); retrying in ${d.delay_s}s`); break;
    case "policy_block": add("warn", `<div class="who">policy</div>Blocked ${esc(d.tool)}: ${esc(d.reason)}`); break;
    case "stall_detected": add("warn", `<div class="who">loop guard</div>Stall detected; the worker was told to change approach.`); break;
    case "approval_requested": state.pending[d.request_id] = { kind: "approval", question: `Approve: ${d.action}`, reason: d.reason }; renderPending();
      add("warn", `<div class="who">approval requested</div>${esc(d.action)}<br><span class="muted small">${esc(d.reason)}</span>`); break;
    case "approval_resolved": delete state.pending[d.request_id]; renderPending();
      add(d.approved ? "good" : "error", `<div class="who">${d.approved ? "approved" : "denied"} by ${esc(d.responder)}</div>${esc(d.note)}`); break;
    case "question": state.pending[d.request_id] = { kind: d.kind, question: d.question, options: d.options }; renderPending();
      add("warn", `<div class="who">worker asks (${esc(d.kind)})</div>${esc(d.question)}`); break;
    case "answer": delete state.pending[d.request_id]; renderPending();
      add("good", `<div class="who">answer from ${esc(d.responder)}</div>${esc(d.answer)}`); break;
    case "plan": state.plan = d.steps; renderPlan(); break;
    case "memory": state.facts[d.key] = d.value; renderFacts(); break;
    case "lesson": add("good", `<div class="who">lesson saved</div>${esc(d.lesson)}`); break;
    case "verification_started": add("verification", `<div class="who">verifier</div>Independent audit started in a fresh, read-only browser session.`); break;
    case "verification":
      add("verification", `<div class="who">verification round ${d.round}: ${d.achieved ? "PASSED" : "FAILED"} (${esc(d.confidence)} confidence)</div>` +
        (d.checks || []).map(c => `<div class="check">${c.passed ? "✅" : "❌"} ${esc(c.check)} <span class="muted small">${esc(c.evidence)}</span></div>`).join("") +
        (d.issues || []).map(i => `<div class="check">⚠️ ${esc(i)}</div>`).join(""));
      break;
    case "usage": state.usage = d; renderHead(); break;
    case "error": add("error", `<div class="who">error · ${esc(d.where)}</div>${esc(d.message)}`); break;
    case "run_finished": state.finished = d; state.pending = {}; renderPending(); renderHead(); renderReport(); refreshRuns(); break;
  }
}

function renderHead() {
  const f = state.finished, [cls, label] = f ? (OUTCOME[f.outcome] || ["", f.outcome]) : ["", "Running…"];
  const u = state.usage;
  $("head").innerHTML = `<h2>Task</h2><div style="font-size:15px">${esc(state.task)}</div>
    <div class="row"><span class="badge ${cls}">${label}</span>
    ${f ? "" : `<button class="secondary" onclick="cancelRun()">Cancel</button>`}</div>
    <div class="stats"><span>model ${esc(state.model)}</span>${u ? `<span>tokens in ${u.input_tokens.toLocaleString()} · out ${u.output_tokens.toLocaleString()} · cached ${u.cache_read_tokens.toLocaleString()}</span>` : ""}
    ${f && f.steps !== undefined ? `<span>${f.steps} steps · ${f.duration_s}s</span>` : ""}</div>`;
}
window.cancelRun = () => api(`/api/runs/${current}/cancel`, { method: "POST" });

function renderPending() {
  const box = $("pendingBox"); if (!box) return;
  box.innerHTML = Object.entries(state.pending).map(([id, p]) => `
    <div class="card pending"><h2>${p.kind === "approval" ? "Approval needed" : "The worker has a question"}</h2>
      <div style="font-size:15px">${esc(p.question)}</div>${p.reason ? `<div class="muted small">${esc(p.reason)}</div>` : ""}
      ${p.kind === "approval" ? `
        <div class="row"><input type="text" id="note-${id}" placeholder="Optional note to the worker"></div>
        <div class="row"><button class="approve" onclick="reply('${id}', true)">Approve</button><button class="deny" onclick="reply('${id}', false)">Deny</button></div>` : `
        ${(p.options || []).map(o => `<button class="secondary" style="margin:6px 6px 0 0" onclick="reply('${id}', null, ${esc(JSON.stringify(o))})">${esc(o)}</button>`).join("")}
        <div class="row"><input type="text" id="note-${id}" placeholder="Type an answer"><button onclick="reply('${id}', null)">Send</button></div>`}
    </div>`).join("");
}
window.reply = async (id, approved, preset) => {
  const note = preset ?? ($(`note-${id}`)?.value || "");
  await api(`/api/runs/${current}/respond`, { method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ request_id: id, approved, answer: note }) });
};

function renderPlan() {
  $("plan").innerHTML = `<ul>${state.plan.map(s => `<li class="${s.status}">${{done: "✔", in_progress: "▶", failed: "✖", skipped: "–"}[s.status] || "○"} ${esc(s.step)}</li>`).join("")}</ul>`;
}
function renderFacts() {
  $("facts").innerHTML = Object.entries(state.facts).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
}
function renderReport() {
  const f = state.finished; if (!f) return;
  const v = f.verification;
  $("report").innerHTML = `<div class="card"><h2>Result</h2>
    <div style="white-space:pre-wrap">${esc(f.summary)}</div>
    ${(f.claims || []).length ? `<h2 style="margin-top:12px">Claims</h2><ul>${f.claims.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}
    ${(f.evidence || []).length ? `<h2>Evidence</h2><ul>${f.evidence.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}
    ${v ? `<h2>Independent verification</h2><div><span class="badge ${v.achieved ? "ok" : "err"}">${v.achieved ? "Outcome confirmed" : "Not confirmed"}</span> <span class="muted small">${esc(v.confidence)} confidence</span></div>
      ${(v.checks || []).map(c => `<div class="check">${c.passed ? "✅" : "❌"} ${esc(c.check)} <span class="muted small">${esc(c.evidence)}</span></div>`).join("")}` : ""}
    <div class="muted small" style="margin-top:8px">Full trace and report: runs/${esc(current)}/</div></div>`;
}
boot();
</script>
</body>
</html>
