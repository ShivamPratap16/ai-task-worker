{% extends "erp_base.html" %}
{% block title %}Vendors - FinOps ERP{% endblock %}
{% block content %}
<h1>Vendors</h1>
<table><thead><tr><th>Name</th><th>Email domain</th><th>Payment terms</th></tr></thead><tbody>
{% for v in vendors %}<tr><td><a href="/erp/vendors/{{ v.id }}">{{ v.name }}</a></td><td>{{ v.email_domain }}</td><td>{{ v.payment_terms }}</td></tr>{% endfor %}
</tbody></table>
{% endblock %}
