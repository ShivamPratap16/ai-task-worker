<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Acme Intranet{% endblock %}</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #1d2330; }
  header { background: #1f3a5f; color: #fff; padding: 10px 24px; display: flex; gap: 24px; align-items: center; }
  header a { color: #cfe0f5; text-decoration: none; }
  header .brand { font-weight: 700; color: #fff; }
  main { max-width: 980px; margin: 24px auto; background: #fff; padding: 24px 32px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e3e6eb; font-size: 14px; }
  th { background: #f0f2f5; }
  label { display: block; margin-top: 12px; font-weight: 600; font-size: 14px; }
  input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #c5cbd3; border-radius: 4px; font: inherit; }
  button, .btn { margin-top: 16px; padding: 8px 16px; background: #2563eb; color: #fff; border: 0; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; font-size: 14px; }
  .btn-danger { background: #b91c1c; }
  .btn-secondary { background: #64748b; }
  .alert { padding: 10px 14px; border-radius: 4px; margin: 12px 0; }
  .alert-error { background: #fdecec; border: 1px solid #f5b5b5; color: #8a1c1c; }
  .alert-success { background: #e8f7ee; border: 1px solid #a6dfbb; color: #17603a; }
  .alert-info { background: #eaf1fd; border: 1px solid #b4cdf6; color: #1e3f78; }
  .muted { color: #6b7280; font-size: 13px; }
  .row { display: flex; gap: 16px; } .row > div { flex: 1; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: #fff; padding: 24px; border-radius: 8px; max-width: 460px; }
  pre.body { white-space: pre-wrap; font-family: inherit; background: #f8fafc; padding: 16px; border-radius: 6px; }
</style>
</head>
<body>
{% block header %}{% endblock %}
<main>{% block content %}{% endblock %}</main>
</body>
</html>
